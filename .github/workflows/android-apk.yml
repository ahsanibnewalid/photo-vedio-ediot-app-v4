name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

env:
  GRADLE_VERSION: 8.11.1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # GitHub-hosted Android runners already provide the Android SDK.
      # Avoid android-actions/setup-android here because its default package
      # list currently requests the obsolete SDK package named "tools".
      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version || true
          "$ANDROID_HOME/platform-tools/adb" version || true

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: photo-video-editor-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
