name: Build Shuvo Studio APKs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          "$ANDROID_HOME/platform-tools/adb" version

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run release lint and build APK/AAB variants
        env:
          SHUVO_KEYSTORE_PATH: ${{ secrets.SHUVO_KEYSTORE_PATH }}
          SHUVO_KEYSTORE_PASSWORD: ${{ secrets.SHUVO_KEYSTORE_PASSWORD }}
          SHUVO_KEY_PASSWORD: ${{ secrets.SHUVO_KEY_PASSWORD }}
          SHUVO_KEY_ALIAS: ${{ secrets.SHUVO_KEY_ALIAS }}
        run: |
          ./gradlew :app:lintRelease :app:assembleDebug :app:assembleRelease :app:bundleRelease --no-daemon --stacktrace

      - name: Upload installable debug APK for device QA
        uses: actions/upload-artifact@v4
        with:
          name: shuvo-studio-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload release APK (signed only when release secrets are configured)
        uses: actions/upload-artifact@v4
        with:
          name: shuvo-studio-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload release mapping for crash de-obfuscation
        uses: actions/upload-artifact@v4
        with:
          name: shuvo-studio-release-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 90

      - name: Upload Android App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: shuvo-studio-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
